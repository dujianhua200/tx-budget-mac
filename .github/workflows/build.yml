name: Build

# 每次推送（main）+ tag（v*）都跑，另保留手动触发。CI 绿了才发布。
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift test
        run: swift test
      - name: Swift build (release)
        run: swift build -c release
      - name: Bundle .app + .dmg
        run: bash ./scripts/bundle.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tx-budget-mac-dmg
          path: build/*.dmg
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.dmg
          generate_release_notes: false
          draft: false
          prerelease: false
