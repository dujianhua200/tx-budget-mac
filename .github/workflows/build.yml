name: Branch Build (No Release)

# 满足用户需求：从任意分支构建 Mac M芯片(.dmg)安装包，上传 Actions Artifact，不触发 Release 发布版本
on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build-mac-arm64:
    runs-on: macos-15
    steps:
      - name: Checkout repository branch
        uses: actions/checkout@v4

      - name: Run Swift unit tests
        run: swift test

      - name: Build release binary (Apple Silicon arm64)
        run: swift build -c release --arch arm64

      - name: Package .app and .dmg from branch
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          SAFE_BRANCH=$(echo "${BRANCH_NAME}" | tr '/' '-' | tr ' ' '-')
          export VERSION="${SAFE_BRANCH}-${SHORT_SHA:0:7}"
          bash ./scripts/bundle.sh

      - name: Compute safe artifact name
        id: artname
        run: echo "name=tx-budget-mac-arm64-$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Upload Mac M-Silicon DMG Artifact (No Release published)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artname.outputs.name }}
          path: build/*.dmg
          if-no-files-found: error
          retention-days: 30
