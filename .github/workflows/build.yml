name: Build

# 每次推送（main）+ tag（v*）都跑，另保留手动触发。CI 绿了才发布。
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要补传 Release 资产的 tag（如 v1.0.2）；留空则不发 Release"
        required: false
        default: ""
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift test
        run: swift test
      - name: Swift build (release)
        run: swift build -c release
      - name: Bundle .app + .dmg
        run: |
          if [[ -n "${{ inputs.release_tag }}" ]]; then
            TAG="${{ inputs.release_tag }}"
            export VERSION="${TAG#v}"
          fi
          bash ./scripts/bundle.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tx-budget-mac-dmg
          path: build/*.dmg
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.release_tag }}"
          fi
          DMG="$(ls build/*.dmg | head -n 1)"
          NAME="$(basename "$DMG")"
          # 找到或创建 Release（按 tag）。
          REL="$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq .id 2>/dev/null || true)"
          if [[ -z "$REL" ]]; then
            REL="$(gh api "repos/${{ github.repository }}/releases" -f tag_name="$TAG" -f name="$TAG" -F draft=false -F prerelease=false --jq .id)"
          fi
          # 删掉与本次文件名不同的旧资产，避免重复。
          DEL_IDS="$(gh api "repos/${{ github.repository }}/releases/$REL/assets" | python3 -c "
          import json, sys
          name = sys.argv[1]
          for a in json.load(sys.stdin):
              if a['name'] != name and a['name'].endswith('-mac-arm64.dmg'):
                  print(a['id'])
          " "$NAME")"
          for AID in $DEL_IDS; do
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$AID" >/dev/null
          done
          # 上传：资产名与 label 均传百分号编码后的文件名。
          # 命名约定（见设计文档 §8）：资产名用拼音 ASCII（huazhou-zhisuan-<version>-mac-arm64.dmg），
          # 因为 GitHub 服务端会把资产 name 里的非 ASCII 字符剥掉（v1.0.2 验证过，
          # 百分号编码也救不了）；拼音名无此问题，校验以 name + label + 大小为准。
          ENC="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe="-._"))' "$NAME")"
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" \
            --data-binary @"$DMG" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$REL/assets?name=$ENC&label=$ENC"
          SIZE="$(stat -f%z "$DMG")"
          GOT="$(gh api "repos/${{ github.repository }}/releases/$REL/assets" | python3 -c "
          import json, sys
          label, size = sys.argv[1], int(sys.argv[2])
          for a in json.load(sys.stdin):
              if a.get('label') == label and a.get('name') == label and a.get('size') == size:
                  print(a.get('label'))
          " "$NAME" "$SIZE")"
          if [[ "$GOT" != "$NAME" ]]; then
            echo "错误：Release 资产校验失败：未找到 name=label=$NAME 且大小一致的资产" >&2
            exit 1
          fi
          # 注意：echo 里的变量必须用 ${NAME} 花括号定界——macOS /bin/bash 3.2 会把
          # $NAME 后紧跟的全角标点误解析为变量名的一部分（v1.0.2 补传踩过此坑）。
          echo "Release 资产已上传（name/label：${NAME}；资产名用拼音 ASCII，下载文件名即此名）"
